name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_cmd: npm run dist:win
          - os: macos-latest
            dist_cmd: npm run dist:mac
          - os: ubuntu-latest
            dist_cmd: npm run dist:linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools icnsutils graphicsmagick xz-utils

      - name: Install dependencies
        run: npm ci

      - name: Build and package installer
        run: ${{ matrix.dist_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/latest*.yml
            release/*blockmap
            release/*.exe.blockmap
            release/*.dmg.blockmap
            release/*.zip.blockmap
            release/*.AppImage.blockmap
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Inspect downloaded files
        run: ls -lh all-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/*.exe
            all-artifacts/*.dmg
            all-artifacts/*.AppImage
            all-artifacts/*.deb
            all-artifacts/*.zip
            all-artifacts/latest*.yml
            all-artifacts/*blockmap
            all-artifacts/*.exe.blockmap
            all-artifacts/*.dmg.blockmap
            all-artifacts/*.zip.blockmap
            all-artifacts/*.AppImage.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
